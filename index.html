ss="muted">A 780 \xD7 780 metre connected region. Choose a district to mark a travel destination. No fast travel; prepare food, water, and a way home.</p><div class="map-layout"><svg id="region-map" role="img" aria-label="Map of the Huni region" viewBox="0 0 800 800"><rect width="800" height="800" fill="#233f32"/><path d="M787 0V800" stroke="#527e82" stroke-width="24"/><g stroke="#9b9a80" stroke-width="7" fill="none">${i}</g>${r}${o}${l}<g fill="#e4d9b5" font-size="16" text-anchor="middle">${s}</g>${a}${c}<path d="M394 415l6 -7 6 7v8h-12z" fill="#f4ce75"/><circle cx="${t(n.player.x)}" cy="${t(n.player.z)}" r="7" fill="#ffffff" stroke="#e4b450" stroke-width="3"/>${n.waypoint?`<path d="M${t(n.waypoint.x)-8} ${t(n.waypoint.z)}h16m-8 -8v16" stroke="#f6ba75" stroke-width="3"/>`:""}<text x="22" y="35" fill="#e6e7cf" font-size="20">N \u2191</text><path d="M30 765h100" stroke="#d8d6bd" stroke-width="3"/><text x="30" y="752" fill="#d8d6bd" font-size="13">100 m</text></svg><div class="map-destinations">${oi.map((h,u)=>`<button data-action="waypoint" data-district="${u}" class="secondary"><b>${h.name}</b><small>${h.supply} \xB7 ${Math.round(Math.hypot(n.player.x-h.x,n.player.z-h.z))} m</small></button>`).join("")}${kn.map(h=>`<button class="secondary" data-action="station-waypoint" data-station="${h.id}">${Hi.name}<small>${h.name}</small></button>`).join("")}<button data-action="home-waypoint">Mark home journal</button><button data-action="clear-waypoint" class="secondary">Clear destination</button><p class="fine">White: you \xB7 Gold house: your base<br>Turquoise: home neighbors<br>Purple: independent travellers (3 maximum)<br>Orange: landslide cuts<br>Blue outlines: lowland catchments; filled: rising water<br>Amber squares: fuel \xB7 Blue/rust dots: vehicles<br>Pale buildings: visited \xB7 Dark: unexplored<br>${n.discovered?.length||0} / ${e.buildings.length} buildings visited</p></div></div>`}function Nm(){return'<h3>Island travel and your survivor</h3><p>New Game opens profession, paired traits and appearance. Press G for the island chart; zoom around your location or mark a landing. The original Huni district detail remains available. Bridges lead to Talampas and Pagitan. A motor banca is needed for Sulyap and Bakawan. Prepare food and fuel for the return journey: your home journal is still the only save point.</p><p>At a banca, E opens controls. W/S move, A/D steer, Space slows, P switches motor/paddle while aboard, E docks when stopped within 10 metres of a landing. Paddling works without fuel. Walk to the landing cache to refuel; its reserve is finite. Never expect a save on arrival.</p><p>Approach a repaired jeepney or motor tricycle to install reinforcement and a launcher mount with mechanics skill and scavenged materials. Craft bolts at home. While operating a mounted vehicle, brake, face the target and press F. Each shot needs a four-second reload, wears the mount and releases a loud Echo; survivors can be hurt too.</p><p class="eyebrow">START HERE \xB7 YOUR FIRST DAY</p><p>You control <b>one person</b> in Barangay Huni. Gather supplies, keep yourself healthy, and return to your home journal to save. The hunched, hook-handed creatures are <b>Listeners</b>; named people with turquoise markers are friendly neighbors.</p><ol class="guide-steps"><li><b>Search your kitchen cupboard.</b> Walk close and press E. Watch the opening animation, then inspect the supplies.</li><li><b>Eat and drink.</b> Tab opens your backpack. Click food or water to use it. Hunger, thirst, fatigue, stress, infection and Echo Debt are better low; health is better high.</li><li><b>Empty your Echo Debt.</b> Activity leaves a memory of sound in your body. At 85 debt, it replays and attracts Listeners. Touch the cyan jar with E \u2192 Transfer debt. Carry a charged jar away from home, place it with B, and discharge it as a distraction.</li><li><b>Plan a supply run.</b> G opens the region map. Choose a district for a destination marker. Take food, water, bandages and a working tool, and leave enough time to walk home.</li><li><b>Defend yourself.</b> F swings your equipped tool at a nearby Listener. It glows orange and draws back before a strike. Press Space just before the lunge to parry; a successful parry stuns it. Holding Space does not block forever.</li><li><b>Sleep when you need it.</b> Use the banig bed at 35+ fatigue, with no nearby danger and debt at 60 or less. Sleep takes two game hours and has a four-hour recovery interval. You can wake early with Esc.</li><li><b>Write in your journal.</b> Walk to the home desk, E \u2192 Save Game. Sleeping, maps, menus, and leaving the game do not save.</li></ol><h3>Vehicles and fuel</h3><p>Eight vehicles are spread around the region: jeepneys, motorized tricycles, bicycles and pedicabs. E opens their controls. Broken vehicles need a hammer, salvaged parts and the listed mechanics level. Motor vehicles burn fuel while driving and idling; bicycles and pedicabs use fatigue. W accelerates, S brakes or reverses, A/D steer, Space brakes, E exits after stopping. An empty motor vehicle must be pushed or refueled. Park within 8 m of a Silangan Fuel pump, get out and press E at the pump to transfer up to 5 L. Pump reserves are finite; hand pumps work without power. Motor noise attracts Listeners. Get out and walk to the home journal to save vehicles and fuel.</p><h3>Friendly fire & reputation</h3><p>F strikes the nearest person or Listener in front of you after the wind-up. Friendly fire is always on. Vehicle impacts damage living bodies based on speed; a parked vehicle does not repeatedly hurt people. Your health and your target\u2019s health appear at the bottom of the screen. Mara and Tessa belong to Huni Courtyard and are friends; Iko belongs to Bayani Workshop. Talk with E to see reputation and friends. The clearly marked Steal action takes a ration and costs 20 reputation. Harm costs 25 and killing costs 80. Scores start at 30 and stop at \u2212100; at \u2212100 the victim and their friends retaliate, with a visible wind-up you can dodge or partially guard. Abandoned container loot is not theft. Reputation persists only when you save at your journal.</p><h3>Weapons & where to find them</h3><p>Tab shows each weapon\u2019s damage, reach, swing duration, fatigue, Echo Debt and condition cost. Equip it by clicking its item. Garden bolos are stocked at Tools & Fasteners and lumber/bamboo hardware suppliers. Pry bars and steel pipes belong to repair workshops and warehouses; try Bayani\u2019s workbench and parts cabinet. Kitchen knives and kawali belong to kitchens and bakeries; Dela Cruz\u2019s kitchen also holds a knife. Improvised planks come from household storage, including the box in Reyes House. Weapons never appear in unrelated general loot. Already-searched containers stay empty.</p><p>The knife is quick, quiet and short-ranged; the bolo hits harder; the pry bar is durable but slow and tiring; the pipe offers reach; the plank wears out quickly. Each swing\u2019s wind-up, contact and recovery use its own timing. All can parry, and a successful timed counter adds damage. Louder weapons build more Echo Debt and emit stronger sound pulses. Keep a working hammer for construction/vehicle repairs. These additions are melee weapons; no ammunition or ranged system is added.</p><h3>Combat timing</h3><p>A Listener raises its arm for 700 ms. Press Space during the final 320 ms for a full parry and stagger, then F for a stronger counter. An early guard can reduce damage by 60%; retry after 600 ms or walk away. Holding Space does not repeat guards. The hammer swing connects after 180 ms and finishes recovery at 650 ms; other weapons have their own timings. You can keep moving throughout: create space when you miss.</p><h3>Wandering survivors</h3><p>Three independent travellers live outside your home community: Lira walks the Centro\u2013Wharf road, Ben travels the upland road, and Nico checks the Palayan road caches. Find purple markers on G, approach and press E for dialogue and trade. Each has three finite trade deals, their own supplies and a rest stop. They eat, drink, rest, fight nearby Listeners and retreat when injured. They are not recruits. Lira and Ben are friends in Daan Mutual Aid; harm and theft affect that community. Their health, journeys and trade stock persist through your home journal. Dead travellers do not respawn.</p><h3>Friendly animals</h3><p>Meet Bantay the aspin and Muning the cat near your home, native chickens around the gardens, and carabao in Palayan. Walk close, E, then Pet gently: stress falls by up to 6. Each animal offers that benefit once per game hour. They wander, graze or peck, pause when you approach, and flee nearby Listeners or moving vehicles. Let frightened animals settle. Petting is separate from F combat. Positions and petting cooldowns persist only through your home journal; time freezes in menus and offline.</p><h3>Random disasters</h3><p>Every four active game hours, independent rolls can bring typhoon-strength wind, a brownout, or a hillside landslide, even without rain or flooding. Gusts reduce outdoor walking and vehicle speed to 65% and add fatigue and Echo Debt; take shelter indoors. Brownouts last 90 game minutes, disable powered discharge rigs and grid service, and cannot be fixed at your home service panel; passive Echo jars still work. A landslide warning gives 21 game minutes to leave an orange map zone. Being caught costs 20 health. Visible debris slides onto the road and leaves difficult rubble for six game hours, reducing travel to 40%; it gradually settles as the hazard ends. The HUD and calendar show active hazards. Menus pause them; your journal saves their remaining time.</p><h3>Flooded streets</h3><p>Only heavy rain (monsoon) overflows the visible drains on Centro road, the waterfront and Palayan road. Floodwater spreads out from the grates and takes several active minutes to drain after rain stops. Shallow water slows you a little; deep water can
